name: Restore extensions, test and build

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      target:
        description: What to build
        type: choice
        options: [both, windows, android]
        default: both

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore real file extensions
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const map = JSON.parse(fs.readFileSync('rename-map.json', 'utf8'));
          let n = 0;
          for (const [from, to] of Object.entries(map.files)) {
            if (!fs.existsSync(from)) {
              if (!fs.existsSync(to)) console.warn('Missing file: ' + from);
              continue;
            }
            fs.mkdirSync(path.dirname(to) || '.', { recursive: true });
            fs.renameSync(from, to);
            n++;
          }
          // Safety net: any other *.txt that hides a known extension gets renamed too.
          const known = ['.html', '.js', '.mjs', '.cjs', '.json', '.md', '.yml', '.yaml', '.css', '.gradle', '.xml'];
          function walk(dir) {
            for (const e of fs.readdirSync(dir, { withFileTypes: true })) {
              if (['node_modules', '.git', 'docs'].includes(e.name)) continue;
              const p = path.join(dir, e.name);
              if (e.isDirectory()) { walk(p); continue; }
              if (!e.name.endsWith('.txt')) continue;
              const base = e.name.slice(0, -4);
              if (known.some(k => base.endsWith(k))) {
                fs.renameSync(p, path.join(dir, base));
                n++;
              }
            }
          }
          walk('.');
          console.log('Restored ' + n + ' files');
          NODE

      - name: Commit the restored files back to the repository
        if: github.ref_type == 'branch'
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Restore file extensions [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi

      - name: Pack the restored source
        run: tar -czf /tmp/source.tgz --exclude=.git .

      - uses: actions/upload-artifact@v4
        with:
          name: source
          path: /tmp/source.tgz
          retention-days: 1

  test:
    needs: restore
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: source
      - run: tar -xzf source.tgz
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run test:legacy

  web:
    needs: restore
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: source
      - run: tar -xzf source.tgz
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: courtyard-house-planner-web
          path: dist/courtyard_house_planner.html

  windows:
    needs: restore
    if: github.event_name != 'workflow_dispatch' || inputs.target != 'android'
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: source
      - run: tar -xzf source.tgz
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build:www
      - run: npx electron-builder --win --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: courtyard-house-planner-windows
          path: dist-app/*.exe

  android:
    needs: restore
    if: github.event_name != 'workflow_dispatch' || inputs.target != 'windows'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: source
      - run: tar -xzf source.tgz
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci
      - run: npm run build:www
      - run: npx cap add android
      - run: npx cap sync android
      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: courtyard-house-planner-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
